<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Setlog-inspired multi-color face palette */
  --face-green: #6FE6A0;
  --face-pink: #F178C2;
  --face-orange: #FF8A4C;
  --face-blue: #5BB8F5;
  --face-purple: #B187F5;
  --face-yellow: #FFD23F;
  --face-red: #FF6B5B;

  --orange: #FF6A2B;
  --orange-dark: #E2540E;
  --ink: #1c1c1e;
  --ink-light: #8a8a8e;
  --ink-faint: #c4c4c8;
  --bg: #ffffff;
  --card-bg: #f5f5f6;
  --card-bg-2: #fafafa;
  --border-soft: #ececed;
  --mint: #d9f7e6;
  --mint-frame: #b8f0cf;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif;
  font-weight: 400;
  background: radial-gradient(circle at 50% 0%, #eafff4 0%, #ffffff 55%);
  color: var(--ink);
  min-height: 100vh;
  padding: 24px 14px;
  position: relative;
  overflow-x: hidden;
}

/* ── PHONE-CARD FRAME (glowing gradient border) ── */
.frame {
  max-width: 1040px;
  margin: 0 auto;
  background: var(--bg);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  padding: 5px;
  background:
    linear-gradient(white, white) padding-box,
    radial-gradient(circle at 50% 0%, rgba(111,230,160,0.9) 0%, rgba(111,230,160,0.35) 45%, rgba(111,230,160,0) 80%) border-box;
  border: 5px solid transparent;
  box-shadow: 0 0 36px rgba(111,230,160,0.45), 0 0 70px rgba(111,230,160,0.2), 0 12px 0 rgba(0,0,0,0.03);
}

/* ── FLOATING FACE STICKERS (background decoration) ── */
.face-sticker {
  position: fixed;
  font-size: 30px;
  pointer-events: none;
  z-index: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
  animation: floatSpin linear infinite;
}
@keyframes floatSpin {
  0%   { transform: translate(0,0) rotate(0deg); }
  25%  { transform: translate(14px,-18px) rotate(90deg); }
  50%  { transform: translate(-6px,-30px) rotate(180deg); }
  75%  { transform: translate(-18px,-10px) rotate(270deg); }
  100% { transform: translate(0,0) rotate(360deg); }
}

/* face emoji avatar badge */
.face-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 14px; flex-shrink: 0;
  animation: wiggle 3.2s ease-in-out infinite;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

/* ── HEADER (Setlog logo style) ── */
.header { padding: 22px 24px 18px; position: relative; z-index: 2; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.logo {
  font-family: 'Baloo 2', cursive;
  font-size: 32px; font-weight: 800;
  color: var(--orange);
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.logo .logo-line1 { display: inline-block; animation: logoFloat1 4.5s ease-in-out infinite; }
.logo .logo-line2 { display: inline-block; animation: logoFloat2 4.5s ease-in-out infinite; animation-delay: 0.3s; margin-top: 2px; }
@keyframes logoFloat1 {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50% { transform: translateY(-3px) rotate(1deg); }
}
@keyframes logoFloat2 {
  0%, 100% { transform: translateY(0) rotate(1.5deg); }
  50% { transform: translateY(-3px) rotate(-1deg); }
}
.header-sub-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.header-sub-title { font-size: 13px; font-weight: 500; color: var(--ink-light); letter-spacing: 0.01em; }

/* ── OVERALL BOOK POOL ── */
.overall-pool {
  margin: 0 24px 20px; background: var(--card-bg); border-radius: 20px; padding: 16px 18px;
}
.overall-pool-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.overall-pool-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.overall-pool-sub { font-size: 11.5px; color: var(--ink-light); margin-bottom: 12px; font-weight: 400; }

.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.book-item { background: var(--bg); border-radius: 16px; padding: 12px 14px; position: relative; transition: transform 0.15s; overflow: hidden; }
.book-item:hover { transform: translateY(-2px); }
.book-item-img { width: calc(100% + 28px); margin: -12px -14px 10px; height: 90px; object-fit: cover; display: block; }
.book-type-badge { display: inline-block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 9px; border-radius: 20px; margin-bottom: 6px; }
.badge-theory { background: #EDE3FF; color: #6B3FD4; }
.badge-art    { background: #D9F7E6; color: #1B8A50; }
.badge-tech   { background: #FFE3EC; color: #D43F7C; }
.badge-other  { background: #FFF1D6; color: #C2790E; }
.book-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 4px; }
.book-who { font-size: 11px; color: var(--ink-light); margin-bottom: 6px; font-weight: 400; }
.book-link { font-size: 11px; color: var(--orange); display: inline-flex; align-items: center; gap: 3px; text-decoration: none; font-weight: 600; }
.book-link:hover { text-decoration: underline; }
.del-btn { position: absolute; top: 8px; right: 8px; background: var(--card-bg); border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; color: var(--ink-light); display: flex; align-items: center; justify-content: center; }
.del-btn:hover { background: var(--ink-faint); color: white; }

.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding: 12px 14px; background: var(--bg); border-radius: 16px; }
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-light); text-transform: uppercase; }

textarea, input[type="text"] {
  font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif; font-weight: 400;
  font-size: 13px; color: var(--ink);
  background: var(--card-bg); border: 1.5px solid transparent;
  border-radius: 12px; padding: 8px 11px; width: 100%; resize: vertical;
  outline: none; transition: border-color 0.13s, background 0.13s; line-height: 1.65;
}
textarea:focus, input[type="text"]:focus { border-color: var(--orange); background: white; }

.file-upload-btn {
  font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; font-weight: 500;
  font-size: 12px; color: var(--ink-light);
  background: var(--card-bg); border: 1.5px solid transparent;
  border-radius: 12px; padding: 9px 11px; width: 100%;
  display: flex; align-items: center; cursor: pointer;
  transition: border-color 0.13s, background 0.13s; line-height: 1.4;
  box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-upload-btn:hover { border-color: var(--orange); background: white; color: var(--ink); }

.btn {
  font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; font-weight: 600;
  font-size: 13px; padding: 8px 18px; border-radius: 20px;
  border: none; background: var(--orange); color: white;
  cursor: pointer; transition: all 0.13s; white-space: nowrap;
}
.btn:hover { background: var(--orange-dark); }
.btn:active { transform: scale(0.96); }
.btn-ghost { background: var(--card-bg); color: var(--ink); }
.btn-ghost:hover { background: var(--ink-faint); color: white; }
.btn-green { background: var(--face-green); color: #0d4d2a; }
.btn-green:hover { background: #57c987; }
.btn-amber { background: var(--face-yellow); color: #6b4d00; }
.btn-amber:hover { background: #f0bd1a; }
.btn-sm { font-size: 12px; padding: 6px 14px; }

/* ── MAIN LAYOUT ── */
.layout { display: flex; gap: 0; align-items: flex-start; position: relative; z-index: 2; }
.month-sidebar { width: 168px; flex-shrink: 0; padding: 0 12px 24px 24px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 14px; }
.month-pill-wrap { display: flex; flex-direction: column; gap: 3px; position: relative; }
.month-pill {
  font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
  padding: 9px 14px; border-radius: 16px; border: none;
  background: var(--card-bg); color: var(--ink-light); cursor: pointer;
  text-align: left; transition: all 0.13s; display: flex; align-items: center; gap: 7px; width: 100%;
}
.month-pill:hover { background: #efefef; color: var(--ink); }
.month-pill.active { background: var(--ink); color: white; }
.month-count { font-size: 10.5px; opacity: 0.65; font-weight: 500; }
.month-pill-del {
  position: absolute; top: 3px; right: 3px;
  background: rgba(0,0,0,0.1); border: none; border-radius: 50%;
  width: 16px; height: 16px; font-size: 10px; color: inherit; cursor: pointer;
  display: none; align-items: center; justify-content: center; line-height: 1;
}
.month-pill-wrap:hover .month-pill-del { display: flex; }
.month-pill-del:hover { background: rgba(0,0,0,0.35); }
.month-kw-row { font-size: 9.5px; color: var(--ink-light); line-height: 1.5; padding: 0 14px 4px; word-break: break-word; font-weight: 400; }
.month-kw-tag { display: inline; }
.month-kw-sep { opacity: 0.4; }
.month-add-btn {
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 16px; border: 1.5px dashed var(--ink-faint);
  background: transparent; color: var(--ink-light); cursor: pointer; text-align: center;
  transition: all 0.13s;
}
.month-add-btn:hover { background: var(--card-bg); border-color: var(--orange); color: var(--orange); }

.month-content { flex: 1; min-width: 0; padding: 0 24px 24px 0; }
.month-block { display: none; }
.month-block.active { display: block; }

.month-header {
  background: var(--ink); border-radius: 22px; padding: 22px 26px; margin-bottom: 20px;
  display: flex; align-items: flex-start; gap: 18px; position: relative; overflow: hidden;
}
.month-name {
  font-family: 'Baloo 2', cursive; font-size: 32px; font-weight: 800;
  color: white; line-height: 1; transform: rotate(-1.5deg); flex-shrink: 0;
}
.month-theme { flex: 1; min-width: 0; }
.month-theme-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.save-indicator { font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--face-green); opacity: 0; transition: opacity 0.3s; font-weight: 600; }
.save-indicator.show { opacity: 1; }
.month-qs { display: flex; flex-direction: column; gap: 7px; }
.month-q-row { display: flex; gap: 9px; align-items: flex-start; }
.month-q-num {
  font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.35); min-width: 16px; padding-top: 8px;
}
textarea.month-q-input {
  font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif; font-weight: 400; font-size: 13px;
  color: white; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 7px 11px; width: 100%; resize: vertical; outline: none;
  line-height: 1.6; transition: border-color 0.13s;
}
textarea.month-q-input:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.13); }
textarea.month-q-input::placeholder { color: rgba(255,255,255,0.35); }

.reading-row { border-top: 1.5px solid rgba(255,255,255,0.1); margin-top: 14px; padding-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.reading-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-right: 2px; }
.rtag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 20px; color: var(--ink); }
.rtag-icon-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 11px; line-height: 1; padding: 0 0 0 2px; opacity: 0.55; transition: opacity 0.12s; }
.rtag-icon-btn:hover { opacity: 1; }
.rtag-add { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; background: rgba(255,255,255,0.08); border: 1.5px dashed rgba(255,255,255,0.3); color: rgba(255,255,255,0.65); cursor: pointer; }
.rtag-editing { background: white; display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; }

.sec-block { margin-bottom: 26px; }
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.sec-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.sec-subtitle { font-size: 11.5px; color: var(--ink-light); margin-top: -8px; margin-bottom: 12px; line-height: 1.6; font-weight: 400; }

.form-panel { background: var(--card-bg); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
.form-panel-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.form-section-title { font-size: 14px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 7px 14px; margin-top: 14px; margin-bottom: 4px; display: inline-flex; align-items: center; gap: 6px; border-radius: 20px; }
.form-section-title.summary { color: #6B3FD4; background: #EDE3FF; }
.form-section-title.imagination { color: #1B8A50; background: #D9F7E6; }
.form-section-title.reference { color: #C2790E; background: #FFF1D6; }

.card-title-block {
  background: white; border: 2.5px solid var(--orange);
  border-radius: 18px; padding: 16px 18px; margin-bottom: 8px;
}
.card-title-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 6px;
}
.card-title-input {
  font-family: 'Noto Sans TC', 'Space Grotesk', sans-serif; font-weight: 700;
  font-size: 18px; color: var(--ink);
  background: transparent; border: none; border-bottom: 2px solid var(--card-bg);
  border-radius: 0; padding: 4px 2px 8px; width: 100%; outline: none;
  transition: border-color 0.13s;
}
.card-title-input:focus { border-bottom-color: var(--orange); background: transparent; }
.card-title-input::placeholder { font-weight: 400; color: var(--ink-faint); }
.card-author-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.card-author-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-light); flex-shrink: 0;
}
.card-author-input {
  font-size: 13px; padding: 6px 12px; background: var(--card-bg);
  border: 1.5px solid transparent; border-radius: 20px; max-width: 200px;
}
.card-author-input:focus { border-color: var(--orange); background: white; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; align-items: stretch; }
.form-field { display: flex; flex-direction: column; gap: 4px; height: 100%; }
.form-field textarea { flex: 1; }
.form-field.bordered-summary textarea,
.form-field.bordered-summary input[type="text"] { border: 2px solid #D9CCFA; }
.form-field.bordered-summary textarea:focus,
.form-field.bordered-summary input[type="text"]:focus { border-color: var(--orange); }
.form-field.bordered-imagination textarea,
.form-field.bordered-imagination input[type="text"] { border: 2px solid #B6E8CC; }
.form-field.bordered-imagination textarea:focus,
.form-field.bordered-imagination input[type="text"]:focus { border-color: var(--orange); }
.form-field.bordered-reference textarea,
.form-field.bordered-reference input[type="text"] { border: 2px solid #FBE0AD; }
.form-field.bordered-reference textarea:focus,
.form-field.bordered-reference input[type="text"]:focus { border-color: var(--orange); }

.bordered-summary-input { border: 2px solid #D9CCFA !important; }
.bordered-summary-input:focus { border-color: var(--orange) !important; }
.bordered-imagination-input { border: 2px solid #B6E8CC !important; }
.bordered-imagination-input:focus { border-color: var(--orange) !important; }
.bordered-reference-input { border: 2px solid #FBE0AD !important; }
.bordered-reference-input:focus { border-color: var(--orange) !important; }
.form-label { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; color: var(--ink-light); text-transform: uppercase; }
.form-actions { display: flex; gap: 8px; margin-top: 12px; }
.ref-upload-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

/* ── RESEARCH CARDS ── */
.sc-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
.sc-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; }
.sc-header { display: flex; align-items: flex-start; gap: 11px; padding: 15px 17px; background: var(--ink); }
.sc-header-emoji { font-size: 22px; padding-top: 1px; animation: wiggle 3.6s ease-in-out infinite; }
.sc-header-info { flex: 1; min-width: 0; }
.sc-header-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: white; line-height: 1.25; }
.sc-header-meta { font-size: 10.5px; color: rgba(255,255,255,0.5); margin-top: 2px; font-weight: 400; }
.sc-kw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.sc-kw-tag { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.13); color: white; }
.sc-header-btns { display: flex; gap: 5px; flex-shrink: 0; align-items: flex-start; }
.sc-action-btn { background: rgba(255,255,255,0.13); border: none; border-radius: 20px; padding: 4px 12px; color: white; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sc-action-btn:hover { background: rgba(255,255,255,0.25); }
.sc-del-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 26px; height: 26px; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.sc-del-btn:hover { background: rgba(255,255,255,0.25); }

.sc-toggle-row3 { display: flex; background: var(--bg); gap: 2px; padding: 2px; }
.sc-toggle3 {
  flex: 1; padding: 11px 8px 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; border: none; font-family: 'Space Grotesk', sans-serif; transition: all 0.15s;
  border-radius: 12px; position: relative;
}
.sc-toggle3-label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.03em; }
.sc-toggle3-chevron { font-size: 9px; transition: transform 0.2s; }
.sc-toggle3-chevron.open { transform: rotate(180deg); }

.sc-toggle3.toggle-summary { background: #F4EFFE; }
.sc-toggle3.toggle-summary .sc-toggle3-label,
.sc-toggle3.toggle-summary .sc-toggle3-chevron { color: #9B7FE0; }
.sc-toggle3.toggle-summary:hover { background: #EDE3FF; }
.sc-toggle3.toggle-summary.open { background: #6B3FD4; }
.sc-toggle3.toggle-summary.open .sc-toggle3-label,
.sc-toggle3.toggle-summary.open .sc-toggle3-chevron { color: white; }

.sc-toggle3.toggle-imagination { background: #EEFBF3; }
.sc-toggle3.toggle-imagination .sc-toggle3-label,
.sc-toggle3.toggle-imagination .sc-toggle3-chevron { color: #5BBE89; }
.sc-toggle3.toggle-imagination:hover { background: #D9F7E6; }
.sc-toggle3.toggle-imagination.open { background: #1B8A50; }
.sc-toggle3.toggle-imagination.open .sc-toggle3-label,
.sc-toggle3.toggle-imagination.open .sc-toggle3-chevron { color: white; }

.sc-toggle3.toggle-reference { background: #FFF8E9; }
.sc-toggle3.toggle-reference .sc-toggle3-label,
.sc-toggle3.toggle-reference .sc-toggle3-chevron { color: #E0AC4D; }

<body>

<div id="faceStickers"></div>

<div class="frame">
  <header class="header">
    <div class="header-top">
      <div class="logo"><div class="logo-row"><span class="logo-line1">Cyborg Resilience Co-lab</span></div><div class="logo-row"><span class="logo-line2">Research Board</span></div></div>

      <div class="field-group" style="flex:1;min-width:90px;"><div class="field-label">簡短說明</div><input type="text" id="bookTypeOverall" placeholder="推薦原因..."></div>
      <div class="field-group" style="flex:1;min-width:65px;"><div class="field-label">推薦人</div><input type="text" id="bookWhoOverall" placeholder="名字"></div>
      <div class="field-group" style="flex:2;min-width:140px;"><div class="field-label">連結（網頁或雲端檔案）</div><input type="text" id="bookLinkOverall" placeholder="https://..."></div>
      <div class="field-group" style="min-width:140px;"><div class="field-label">或上傳圖片</div><label class="file-upload-btn" for="bookImgOverall"><span id="bookImgOverallLabel">選擇圖片</span></label><input type="file" id="bookImgOverall" accept="image/*" style="display:none;" onchange="updateFileLabel(this,'bookImgOverallLabel')"></div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">載入中...</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
// ★ 在這裡貼上你的 Apps Script 網址 ★
const API_URL = 'https://script.google.com/macros/s/AKfycbwu1_yRiQKgB2yGMy4sh-gluT_7LJi9Ur76nyW9dR5b69yD2KfaLg2meaN2FSkocs5m/exec';
// ════════════════════════════════════════════
const IS_CONFIGURED = API_URL !== 'YOUR_APPS_SCRIPT_URL_HERE';

const MONTH_SEQUENCE = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── FACE STICKERS (Setlog-style floating + rotating colored faces) ──
const FACES = ['😊','😄','🙂','😎','🤩','😺','✦','◉'];
const FACE_COLORS = ['#6FE6A0','#F178C2','#FF8A4C','#5BB8F5','#B187F5','#FFD23F','#FF6B5B'];
const STICKER_POSITIONS = [
  {top:'8%', left:'4%'}, {top:'18%', left:'92%'}, {top:'42%', left:'2%'},
  {top:'58%', left:'95%'}, {top:'78%', left:'6%'}, {top:'88%', left:'90%'},
  {top:'30%', left:'97%'}, {top:'66%', left:'1%'}
];
function refreshFloatingEmojis() {
  const wrap = document.getElementById('faceStickers');
  if (!wrap) return;
  wrap.innerHTML = '';
  // pool = base faces + any custom emojis chosen for months, deduped
  const customEmojis = monthDefs.map(m => m.emoji).filter(Boolean);
  const pool = [...new Set([...customEmojis, ...FACES])];
  STICKER_POSITIONS.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'face-sticker';
    el.textContent = pool[i % pool.length];
    el.style.top = pos.top;
    el.style.left = pos.left;
    el.style.color = FACE_COLORS[i % FACE_COLORS.length];
    el.style.animationDuration = (10 + i * 2.3) + 's';
    el.style.animationDelay = (i * 0.6) + 's';
    wrap.appendChild(el);
  });
}

// ── DEFAULT MONTH CONTENT ──
const defaultMonths = [
  { id:'june', label:'June', emoji:'😊', questions:["在後人類戰爭中，「通訊」是否本身就是一種庇護、武器或幽靈？","自主網路與離線網路如何成為戰爭時的民間基礎設施？","我們如何在不複製軍事邏輯的前提下，諧擬、拆解或反轉戰爭科技？"], reading:["自主武器與 meaningful human control","Mesh network / dComms / offline communication","Paul Virilio：戰爭、影像與感知技術","Forensic Architecture：空間、證據與人權調查","台灣民防、通訊中斷與基礎設施韌性"] },
  { id:'july', label:'July', emoji:'😄', questions:["戰爭中的網路失效、斷線、延遲與誤傳，如何成為裝置語言？","Mesh network 是否可以不只是技術，而是一種集體照護結構？","觀眾或參與者如何理解「後人類戰爭」而不被技術細節排除？"], reading:["Mesh network 與災難通訊","Tactical media","戰爭中的基礎設施與 civilian harm","AI / autonomous systems 的人類控制問題","人權調查中的 open source evidence"] },
  { id:'august', label:'August', emoji:'🙂', questions:["戰爭中的身體如何被感測、分類、保護、暴露或誤認？","反監控時尚是否可以不只是遮蔽，而是成為一種表演、護身符或集體信號？","我們如何避免讓參與者在 focus group 中重複暴露創傷？"], reading:["Surveillance studies","Counter-surveillance fashion","Judith Butler：Frames of War","Susan Sontag：觀看他人痛苦","護身符、軍服、偽裝、民防服裝"] },
  { id:'september', label:'September', emoji:'😎', questions:["無人機的視角是否仍然是「視覺」？還是演算法、熱源、訊號的複合感知？","戰爭劇本中，誰是角色？人、訊號、幽靈、無人機、AI 是否都可以說話？","我們如何讓劇本不是單純敘事，而是裝置操作手冊？"], reading:["Drone warfare","Trevor Paglen：影像與監控","Hito Steyerl：poor image / vertical perspective","Forensic Architecture 的空間重建方法","靈性戰爭、亡者記憶、幽靈與戰地地景"] },
  { id:'october', label:'October', emoji:'🤩', questions:["劇本可以如何被「駭寫」？","Playbook 是操作手冊、表演文本、民防指南，還是某種儀式腳本？","翻譯是否只是語言轉換，還是把不同社群的恐懼、記憶與技術能力重新配置？"], reading:["Tactical media manuals","Artist playbooks / scores / scripts","Fluxus score","民防手冊、災難應變手冊","Human rights documentation protocol"] },
  { id:'november', label:'November', emoji:'😺', questions:["如果戰爭中的警報不再只是聲音與影像，民防還能透過什麼感官發生？","觸覺、震動、溫度、氣味、壓力、延遲、沉默，如何成為裝置語言？","展覽是否能讓觀眾進入一種 rehearsal，而不是單純觀看戰爭？"], reading:["Disability aesthetics","Access intimacy","非視覺／非聽覺介面","Crip technoscience","民防、避難、照護與感官替代"] }
];

let monthDefs = defaultMonths.map(m => ({ ...m, questions: [...m.questions], reading: [...m.reading] }));

const data = {};
let overallBooks = [];
let activeMonth = monthDefs[0].id;
let activeWallTab = {};

const EMOJI_PICKER_OPTIONS = ['😊','😄','🙂','😎','🤩','😺','😼','🥳','😇','🤖','👽','🦄','🐙','🌙','⭐','✦','◉','🔥','🌈','💫','👾','🛸','🪐','🧬','🫧'];
const cardEmojis = ['🔬','💡','⚡','🌐','🎞️','📡','🌿','🔮','🦾','🛰️'];
const typeColors = { '理論':'badge-theory','藝術':'badge-art','技術':'badge-tech' };

function ensureMonthData(mid) { if (!data[mid]) data[mid] = { cards:[], wall:[] }; if (!(mid in activeWallTab)) activeWallTab[mid] = 'q'; }
monthDefs.forEach(m => ensureMonthData(m.id));

function renderMd(text) { if (!text) return ''; try { return marked.parse(text); } catch(e) { return text.replace(/\n/g,'<br>'); } }
function parseImgList(val) { if (!val) return []; try { const p = JSON.parse(val); return Array.isArray(p) ? p : [val]; } catch(e) { return val ? [val] : []; } }

async function apiGet(sheet) { const res = await fetch(`${API_URL}?action=get&sheet=${sheet}`); if (!res.ok) throw new Error('Network error'); return res.json(); }
async function apiPost(body) { const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }); if (!res.ok) throw new Error('Network error'); return res.json(); }
function showLoading(msg='載入中...') { document.getElementById('loadingText').textContent = msg; document.getElementById('loadingOverlay').style.display = 'flex'; }
function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

const debounceTimers = {};
function debounce(key, fn, delay=900) { clearTimeout(debounceTimers[key]); debounceTimers[key] = setTimeout(fn, delay); }

function nextMonthLabel() {
  if (!monthDefs.length) return 'January';
  const last = monthDefs[monthDefs.length - 1].label;
  const idx = MONTH_SEQUENCE.indexOf(last);
  if (idx === -1) return 'New Month';
  return MONTH_SEQUENCE[(idx + 1) % 12];
}

async function loadAllData() {
  if (!IS_CONFIGURED) { buildAllBlocks(); renderSidebar(); monthDefs.forEach(m=>renderReadingTags(m.id)); renderBooksOverall(); return; }
  showLoading('從 Google Sheets 載入資料...');
  try {
    const [monthsRows, books, cards, wall] = await Promise.all([
      apiGet('months'), apiGet('books'), apiGet('cards'), apiGet('wall')
    ]);

    if (monthsRows.length) {
      monthDefs = monthsRows
        .sort((a,b) => Number(a.order||0) - Number(b.order||0))
        .map((row, i) => ({
          id: row.monthId,
          label: row.label || row.monthId,
          emoji: row.emoji || FACES[i % FACES.length],
          questions: row.questions ? JSON.parse(row.questions) : ['', '', ''],
          reading: row.reading ? JSON.parse(row.reading) : []
        }));
      activeMonth = monthDefs[0].id;
    }
    monthDefs.forEach(m => ensureMonthData(m.id));

    monthDefs.forEach(m => { data[m.id] = { cards:[], wall:[] }; });
    overallBooks = [];

    books.forEach(b => { overallBooks.push({ id:Number(b.id), title:b.title, type:b.type, who:b.who, link:b.link||'', img:b.img||'' }); });

    cards.forEach(c => {
      if (!data[c.month]) data[c.month] = { cards:[], wall:[] };
      data[c.month].cards.push({
        id:Number(c.id), title:c.title, author:c.author, date:c.date, time:c.time, editedAt:c.editedAt||'',
        sum1:c.sum1||'', sum2:c.sum2||'',
        imag1:c.imag1||'', imag2:c.imag2||'', imag3:c.imag3||'', imag4:c.imag4||'',
        refText:c.refText||'', refUrl:c.refUrl||'', refImgs: parseImgList(c.refImg),
        keywords: c.keywords ? c.keywords.split(',').filter(Boolean) : [],
        openSummary:true, openImagination:false, openReference:false, editing:false
      });
    });

    wall.forEach(w => {
      if (!data[w.month]) data[w.month] = { cards:[], wall:[] };
      data[w.month].wall.push({
        id:Number(w.id), type:w.type, who:w.who||'匿名',
        text:w.text||'', title:w.title||'', desc:w.desc||'', url:w.url||'', imgSrc:w.imgSrc||''
      });
    });

    buildAllBlocks();
    renderSidebar();
    renderBooksOverall();
    monthDefs.forEach(m => { renderReadingTags(m.id); renderCards(m.id); renderWall(m.id); });
    refreshFloatingEmojis();
    toast('✦ 資料載入完成！');
  } catch(e) {
    toastError('⚠️ 載入失敗，請檢查 API URL');
    console.error(e);
    buildAllBlocks(); renderSidebar(); monthDefs.forEach(m=>renderReadingTags(m.id)); renderBooksOverall();
  }
  hideLoading();
}

async function saveMonth(mid) {
  if (!IS_CONFIGURED) return;
  const m = monthDefs.find(x => x.id === mid);
  if (!m) return;
  const order = monthDefs.findIndex(x=>x.id===mid);
  const indEl = document.getElementById(`saveInd-${mid}`);
  try {
    await apiPost({ action:'upsertMonth', sheet:'months', data:{ monthId: mid, label: m.label, emoji: m.emoji||'', order, questions: JSON.stringify(m.questions), reading: JSON.stringify(m.reading) } });
    if (indEl) { indEl.textContent = '✓ 已儲存'; indEl.classList.add('show'); setTimeout(()=>indEl.classList.remove('show'), 1500); }
  } catch(e) { toastError('⚠️ 月份儲存失敗'); }
}

function openEmojiPicker() {
  const label = nextMonthLabel();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'emojiPickerOverlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">新增「${label}」</div>
      <div class="modal-sub">幫這個月選一個代表 Emoji</div>
      <div class="emoji-grid">
        ${EMOJI_PICKER_OPTIONS.map(e => `<button class="emoji-option" onclick="confirmAddMonth('${label}','${e}')">${e}</button>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:14px;" onclick="closeModal('emojiPickerOverlay')">取消</button>
    </div>`;
  document.body.appendChild(overlay);
}
function closeModal(id) { const el = document.getElementById(id); if (el) el.remove(); }

async function confirmAddMonth(label, emoji) {
  closeModal('emojiPickerOverlay');
  const id = label.toLowerCase() + '-' + Date.now();
  const newMonth = { id, label, emoji, questions:['', '', ''], reading:[] };
  monthDefs.push(newMonth);
  ensureMonthData(id);
  data[id] = { cards:[], wall:[] };
  buildAllBlocks();
  renderSidebar();
  renderReadingTags(id);
  renderCards(id);
  renderWall(id);
  setMonth(id);
  toast(`已新增 ${emoji} ${label}！`);
  if (IS_CONFIGURED) {
    try { await apiPost({ action:'upsertMonth', sheet:'months', data:{ monthId:id, label, emoji, order: monthDefs.length-1, questions: JSON.stringify(newMonth.questions), reading: JSON.stringify(newMonth.reading) } }); }
    catch(e) { toastError('⚠️ 新增月份儲存失敗'); }
  }
}

function deleteMonth(mid, evt) {
  if (evt) evt.stopPropagation();
  if (monthDefs.length <= 1) { toast('⚠️ 至少要保留一個月份'); return; }
  const m = monthDefs.find(x=>x.id===mid);
  if (!m) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'deleteConfirmOverlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">刪除「${m.emoji||''} ${m.label}」？</div>
      <div class="modal-sub">這個月份的所有書單、Research Cards 與牆面內容都會一併刪除，無法復原。</div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:center;">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('deleteConfirmOverlay')">取消</button>
        <button class="btn btn-sm" style="background:var(--face-red);" onclick="confirmDeleteMonth('${mid}')">確定刪除</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function confirmDeleteMonth(mid) {
  closeModal('deleteConfirmOverlay');
  const m = monthDefs.find(x=>x.id===mid);
  if (!m) return;
  monthDefs = monthDefs.filter(x=>x.id!==mid);
  delete data[mid];
  if (activeMonth === mid) activeMonth = monthDefs[0].id;
  buildAllBlocks();
  renderSidebar();
  monthDefs.forEach(mm=>{ renderReadingTags(mm.id); renderCards(mm.id); renderWall(mm.id); });
  toast(`已刪除 ${m.label}`);
  if (IS_CONFIGURED) {
    try { await apiPost({ action:'deleteMonth', sheet:'months', id:mid }); }
    catch(e) { toastError('⚠️ 刪除同步失敗'); }
  }
}

function renderSidebar() {
  const sb = document.getElementById('monthSidebar');
  sb.innerHTML = monthDefs.map((m,mi) => {
    const count = (data[m.id] && data[m.id].cards.length) || 0;
    const faceEmoji = m.emoji || FACES[mi % FACES.length];
    const faceColor = FACE_COLORS[mi % FACE_COLORS.length];
    const kwHtml = m.reading.length
      ? `<div class="month-kw-row">${m.reading.map(r=>`<span class="month-kw-tag">${r}</span>`).join('<span class="month-kw-sep"> · </span>')}</div>`
      : '';
    return `<div class="month-pill-wrap">
      <button class="month-pill${m.id===activeMonth?' active':''}" onclick="setMonth('${m.id}')">
        <span class="face-badge" style="color:${faceColor};">${faceEmoji}</span>${m.label}${count>0?` <span class="month-count">(${count})</span>`:''}
      </button>
      <button class="month-pill-del" onclick="deleteMonth('${m.id}', event)" title="刪除月份">×</button>
      ${kwHtml}
    </div>`;
  }).join('') + `<button class="month-add-btn" onclick="openEmojiPicker()">+ 新增月份</button>`;
  refreshFloatingEmojis();
}
function setMonth(id) {
  activeMonth = id;
  renderSidebar();
  document.querySelectorAll('.month-block').forEach(b => b.classList.remove('active'));
  const blk = document.getElementById('block-'+id);
  if (blk) blk.classList.add('active');
}

function buildAllBlocks() {
  document.getElementById('monthContent').innerHTML = monthDefs.map(m =>
    `<div class="month-block${m.id===activeMonth?' active':''}" id="block-${m.id}">
      ${!IS_CONFIGURED ? `<div class="setup-banner">
        <div class="setup-banner-icon">⚠️</div>
        <div class="setup-banner-text"><strong>尚未連接 Google Sheets。</strong><br>請打開這個 HTML 檔案，找到 <code>YOUR_APPS_SCRIPT_URL_HERE</code> 並替換成你的 Apps Script 網址。</div>
      </div>` : ''}

      ${buildCardsSection(m.id)}
      ${buildWallSection(m.id)}

}

function buildMonthHeader(m) {
  return `<div class="month-header">

      <div class="month-theme-label">

let editingTag = null;
const RTAG_COLORS = ['#D9F7E6','#FDE0F0','#FFE3D1','#DCEEFD','#EDE3FF','#FFF1C2','#FFE0DC'];
function renderReadingTags(mid) {
  const m = monthDefs.find(x => x.id === mid);
  const el = document.getElementById('reading-'+mid);
  if (!el || !m) return;
  el.innerHTML = `<span class="reading-label">閱讀方向</span>` +
    m.reading.map((r,i) => {
      const color = RTAG_COLORS[i % RTAG_COLORS.length];
      const isEditing = editingTag && editingTag.mid===mid && editingTag.index===i;
      if (isEditing) return `<span class="rtag rtag-editing">
        <input type="text" id="rtag-input-${mid}-${i}" value="${r.replace(/"/g,'&quot;')}"
          style="font-size:11px;color:var(--ink);background:white;border:none;border-radius:6px;padding:1px 5px;width:${Math.max(r.length,8)}ch;outline:none;font-family:'Noto Sans TC',sans-serif;"
          onkeydown="if(event.key==='Enter'){saveRTag('${mid}',${i});}if(event.key==='Escape'){cancelRTag();}">
        <button class="rtag-icon-btn" onclick="saveRTag('${mid}',${i})" title="儲存" style="color:#1B8A50;">✓</button>
        <button class="rtag-icon-btn" onclick="cancelRTag()" title="取消" style="opacity:0.6;">✕</button>
      </span>`;
      return `<span class="rtag" style="background:${color};">${r}
        <button class="rtag-icon-btn" onclick="startEditRTag('${mid}',${i})" title="編輯" style="opacity:0.5;">✎</button>
        <button class="rtag-icon-btn" onclick="removeRTag('${mid}',${i})" title="移除">×</button>
      </span>`;
    }).join('') +
    `<span class="rtag rtag-add" onclick="addRTag('${mid}')">+ 新增</span>`;
  if (editingTag && editingTag.mid===mid) {
    const inp = document.getElementById(`rtag-input-${mid}-${editingTag.index}`);
    if (inp) { inp.focus(); inp.select(); }
  }
}
function startEditRTag(mid,i){ editingTag={mid,index:i}; renderReadingTags(mid); }
function saveRTag(mid,i){ const inp=document.getElementById(`rtag-input-${mid}-${i}`); const v=inp?inp.value.trim():''; if(v) monthDefs.find(x=>x.id===mid).reading[i]=v; editingTag=null; renderReadingTags(mid); saveMonth(mid); renderSidebar(); }
function cancelRTag(){ const mid=editingTag?editingTag.mid:null; editingTag=null; if(mid) renderReadingTags(mid); }
function removeRTag(mid,i){ if(editingTag&&editingTag.mid===mid) editingTag=null; monthDefs.find(x=>x.id===mid).reading.splice(i,1); renderReadingTags(mid); saveMonth(mid); renderSidebar(); }
function addRTag(mid){ monthDefs.find(x=>x.id===mid).reading.push('新閱讀方向'); const ni=monthDefs.find(x=>x.id===mid).reading.length-1; editingTag={mid,index:ni}; renderReadingTags(mid); saveMonth(mid); renderSidebar(); }

async function addBookOverall() {
  const t=document.getElementById('bookTitleOverall').value.trim();
  if(!t) return toast('請填入標題！');
  const type=document.getElementById('bookTypeOverall').value.trim()||'其他';
  const who=document.getElementById('bookWhoOverall').value.trim()||'匿名';
  const link=document.getElementById('bookLinkOverall').value.trim();
  const file=document.getElementById('bookImgOverall').files[0];
  const id=Date.now();
  const finish = (img) => {
    overallBooks.unshift({id,title:t,type,who,link,img:img||''});
    ['bookTitleOverall','bookTypeOverall','bookWhoOverall','bookLinkOverall'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('bookImgOverall').value='';
    renderBooksOverall(); toast('許願池加入！');
    if(IS_CONFIGURED){ apiPost({action:'add',sheet:'books',data:{id,title:t,type,who,link,img:img||''}}).catch(()=>toastError('⚠️ 儲存失敗')); }
  };
  if (file) { const reader=new FileReader(); reader.onload=e=>finish(e.target.result); reader.readAsDataURL(file); }
  else finish('');
}
async function removeBookOverall(id){
  overallBooks=overallBooks.filter(b=>b.id!==id); renderBooksOverall();
  if(IS_CONFIGURED){ try{ await apiPost({action:'delete',sheet:'books',id}); } catch(e){ toastError('⚠️ 刪除失敗'); } }
}
function renderBooksOverall(){
  const el=document.getElementById('bookGridOverall');
  if(!overallBooks.length){el.innerHTML='<div class="empty-state">許願池還空著 — 加入第一個！</div>';return;}
  el.innerHTML=overallBooks.map(b=>`<div class="book-item">
    ${b.img?`<img src="${b.img}" class="book-item-img" alt="${b.title}">`:''}
    <div class="book-type-badge ${typeColors[b.type]||'badge-other'}">${b.type}</div>
    <div class="book-name">${b.title}</div>
    <div class="book-who">✦ ${b.who}</div>
    ${b.link?`<a href="${b.link}" target="_blank" class="book-link">🔗 開啟原始檔</a>`:''}
    <button class="del-btn" onclick="removeBookOverall(${b.id})" aria-label="移除">×</button>
  </div>`).join('');
}

function updateFileLabel(input, labelId) {
  const labelEl = document.getElementById(labelId);
  if (!labelEl) return;
  if (input.files && input.files.length) {
    labelEl.textContent = input.files.length > 1 ? `已選 ${input.files.length} 張圖片` : input.files[0].name;
  } else {
    labelEl.textContent = '選擇圖片';
  }
}

function toggleForm(id){ const f=document.getElementById(id); f.style.display=f.style.display==='none'?'block':'none'; }

async function readFilesAsDataURLs(fileList) {
  const files = Array.from(fileList || []);
  return Promise.all(files.map(f => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(f);
  })));
}

async function addCard(mid){
  const title=document.getElementById(`ncTitle-${mid}`).value.trim();
  if(!title) return toast('請填入材料標題！');
  const kws=document.getElementById(`ncKeywords-${mid}`).value.split(',').map(k=>k.trim()).filter(Boolean);
  const now=new Date();
  const id=Date.now();
  const date=now.toLocaleDateString('zh-TW');
  const time=now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const author=document.getElementById(`ncAuthor-${mid}`).value.trim()||'匿名';
  const sum1=document.getElementById(`ncSum1-${mid}`).value.trim();
  const sum2=document.getElementById(`ncSum2-${mid}`).value.trim();
  const imag1=document.getElementById(`ncImag1-${mid}`).value.trim();
  const imag2=document.getElementById(`ncImag2-${mid}`).value.trim();
  const imag3=document.getElementById(`ncImag3-${mid}`).value.trim();
  const imag4=document.getElementById(`ncImag4-${mid}`).value.trim();
  const refText=document.getElementById(`ncRefText-${mid}`).value.trim();
  const refUrl=document.getElementById(`ncRefUrl-${mid}`).value.trim();
  const refFiles=document.getElementById(`ncRefImg-${mid}`).files;

  const refImgs = await readFilesAsDataURLs(refFiles);
  const refImgJson = JSON.stringify(refImgs);

  const card = { id, title, author, date, time, editedAt:'', sum1, sum2, imag1, imag2, imag3, imag4, refText, refUrl, refImgs, keywords:kws, openSummary:true, openImagination:false, openReference:false, editing:false };
  ensureMonthData(mid);
  data[mid].cards.push(card);
  [`ncTitle-${mid}`,`ncAuthor-${mid}`,`ncSum1-${mid}`,`ncSum2-${mid}`,`ncImag1-${mid}`,`ncImag2-${mid}`,`ncImag3-${mid}`,`ncImag4-${mid}`,`ncRefText-${mid}`,`ncRefUrl-${mid}`,`ncKeywords-${mid}`].forEach(x=>document.getElementById(x).value='');
  document.getElementById(`ncRefImg-${mid}`).value='';
  const lbl = document.getElementById(`ncRefImgLabel-${mid}`); if (lbl) lbl.textContent = '選擇圖片';
  document.getElementById(`cardForm-${mid}`).style.display='none';
  renderCards(mid); renderSidebar(); toast('Research Card 建立完成！');
  if(IS_CONFIGURED){
    try{ await apiPost({action:'add',sheet:'cards',data:{id,month:mid,title,author,date,time,editedAt:'',sum1,sum2,imag1,imag2,imag3,imag4,refText,refUrl,refImg:refImgJson,keywords:kws.join(',')}}); }
    catch(e){ toastError('⚠️ 儲存失敗'); }
  }
}

async function removeCard(mid,id){
  data[mid].cards=data[mid].cards.filter(c=>c.id!==id); renderCards(mid); renderSidebar();
  if(IS_CONFIGURED){ try{ await apiPost({action:'delete',sheet:'cards',id}); } catch(e){ toastError('⚠️ 刪除失敗'); } }
}

function toggleSc(mid,id,sec){ const c=data[mid].cards.find(c=>c.id===id); if(c){ const key='open'+sec; c[key]=!c[key]; renderCards(mid);} }

async function toggleEdit(mid,id){
  const c=data[mid].cards.find(c=>c.id===id); if(!c) return;
  if(c.editing){
    c.title=document.getElementById(`edit_title_${id}`).value.trim()||c.title;
    c.author=document.getElementById(`edit_author_${id}`).value.trim()||c.author;
    c.sum1=document.getElementById(`edit_sum1_${id}`).value.trim();
    c.sum2=document.getElementById(`edit_sum2_${id}`).value.trim();
    c.imag1=document.getElementById(`edit_imag1_${id}`).value.trim();
    c.imag2=document.getElementById(`edit_imag2_${id}`).value.trim();
    c.imag3=document.getElementById(`edit_imag3_${id}`).value.trim();
    c.imag4=document.getElementById(`edit_imag4_${id}`).value.trim();
    c.refText=document.getElementById(`edit_refText_${id}`).value.trim();
    c.refUrl=document.getElementById(`edit_refUrl_${id}`).value.trim();
    c.keywords=document.getElementById(`edit_kw_${id}`).value.split(',').map(k=>k.trim()).filter(Boolean);
    const now=new Date();
    c.editedAt=now.toLocaleDateString('zh-TW')+' '+now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    c.editing=false;
    toast('卡片已更新！');
    if(IS_CONFIGURED){
      try{ await apiPost({action:'update',sheet:'cards',data:{id:c.id,month:mid,title:c.title,author:c.author,date:c.date,time:c.time,editedAt:c.editedAt,sum1:c.sum1,sum2:c.sum2,imag1:c.imag1,imag2:c.imag2,imag3:c.imag3,imag4:c.imag4,refText:c.refText,refUrl:c.refUrl,refImg:JSON.stringify(c.refImgs||[]),keywords:c.keywords.join(',')}}); }
      catch(e){ toastError('⚠️ 儲存失敗'); }
    }
  } else { c.editing=true; c.openSummary=true; }
  renderCards(mid);
}

function renderCards(mid){
  const el=document.getElementById(`scList-${mid}`);
  if (!el) return;
  const cards=(data[mid]&&data[mid].cards)||[];
  if(!cards.length){el.innerHTML='<div class="empty-state">還沒有 Research Card — 點「新增卡片」開始！</div>';return;}
  el.innerHTML=cards.map((c,ci)=>{
    const emo=cardEmojis[ci%cardEmojis.length];
    const meta=`填寫：${c.author} · ${c.date} ${c.time}${c.editedAt?` · 編輯於 ${c.editedAt}`:''}`;

    if (c.editing) {
      return `<div class="sc-card">
        <div class="sc-header">
          <div class="sc-header-emoji">${emo}</div>
          <div class="sc-header-info"><div class="sc-header-title">${c.title}</div><div class="sc-header-meta">${meta}</div></div>
          <div class="sc-header-btns">
            <button class="sc-action-btn" onclick="toggleEdit('${mid}',${c.id})">✓ 儲存</button>
            <button class="sc-del-btn" onclick="removeCard('${mid}',${c.id})" aria-label="刪除">×</button>
          </div>
        </div>
        <div class="sc-section open">
          <div class="card-title-block" style="border-color:var(--card-bg);">
            <div class="card-title-label">材料標題</div>
            <input type="text" id="edit_title_${c.id}" class="card-title-input" value="${c.title.replace(/"/g,'&quot;')}">
            <div class="card-author-row">
              <span class="card-author-label">填寫人</span>
              <input type="text" id="edit_author_${c.id}" class="card-author-input" value="${c.author.replace(/"/g,'&quot;')}">
            </div>
          </div>
          <div class="form-section-title summary">SUMMARY</div>
          <div class="a-grid" style="margin-bottom:18px;">
            <div><div class="a-label">這份材料在說什麼？</div><textarea class="bordered-summary-input" id="edit_sum1_${c.id}" rows="3">${c.sum1}</textarea></div>
            <div><div class="a-label">與研究主題的關係？</div><textarea class="bordered-summary-input" id="edit_sum2_${c.id}" rows="3">${c.sum2}</textarea></div>
          </div>
          <div class="form-section-title imagination">IMAGINATION</div>
          <div class="a-grid" style="margin-bottom:18px;">
            <div><div class="a-label green">轉化成什麼裝置／場景？</div><textarea class="bordered-imagination-input" id="edit_imag1_${c.id}" rows="3">${c.imag1}</textarea></div>
            <div><div class="a-label green">需要什麼材料、訊號、測試？</div><textarea class="bordered-imagination-input" id="edit_imag2_${c.id}" rows="3">${c.imag2}</textarea></div>
            <div><div class="a-label green">誰在使用？誰被排除？</div><textarea class="bordered-imagination-input" id="edit_imag3_${c.id}" rows="3">${c.imag3}</textarea></div>
            <div><div class="a-label green">倫理風險？</div><textarea class="bordered-imagination-input" id="edit_imag4_${c.id}" rows="3">${c.imag4}</textarea></div>
          </div>
          <div class="form-section-title reference">REFERENCE</div>
          <div style="margin-bottom:9px;"><div class="a-label amber">文字說明</div><textarea class="bordered-reference-input" id="edit_refText_${c.id}" rows="2">${c.refText}</textarea></div>
          <div style="margin-bottom:18px;"><div class="a-label amber">連結</div><input type="text" class="bordered-reference-input" id="edit_refUrl_${c.id}" value="${c.refUrl.replace(/"/g,'&quot;')}"></div>
          <div><div class="a-label">關鍵字（逗號分隔）</div><input type="text" id="edit_kw_${c.id}" value="${c.keywords.join(', ').replace(/"/g,'&quot;')}"></div>
        </div>
      </div>`;
    }

    return `<div class="sc-card">
      <div class="sc-header">
        <div class="sc-header-emoji">${emo}</div>
        <div class="sc-header-info">
          <div class="sc-header-title">${c.title}</div>
          <div class="sc-header-meta">${meta}</div>
          ${c.keywords.length?`<div class="sc-kw">${c.keywords.map(k=>`<span class="sc-kw-tag">#${k}</span>`).join('')}</div>`:''}
        </div>
        <div class="sc-header-btns">
          <button class="sc-action-btn" onclick="toggleEdit('${mid}',${c.id})">✎ 編輯</button>
          <button class="sc-del-btn" onclick="removeCard('${mid}',${c.id})" aria-label="刪除">×</button>
        </div>
      </div>
      <div class="sc-toggle-row3">
        <button class="sc-toggle3 toggle-summary${c.openSummary?' open':''}" onclick="toggleSc('${mid}',${c.id},'Summary')"><span class="sc-toggle3-label">SUMMARY</span><span class="sc-toggle3-chevron${c.openSummary?' open':''}">▾</span></button>
        <button class="sc-toggle3 toggle-imagination${c.openImagination?' open':''}" onclick="toggleSc('${mid}',${c.id},'Imagination')"><span class="sc-toggle3-label">IMAGINATION</span><span class="sc-toggle3-chevron${c.openImagination?' open':''}">▾</span></button>
        <button class="sc-toggle3 toggle-reference${c.openReference?' open':''}" onclick="toggleSc('${mid}',${c.id},'Reference')"><span class="sc-toggle3-label">REFERENCE</span><span class="sc-toggle3-chevron${c.openReference?' open':''}">▾</span></button>
      </div>

      <div class="sc-section section-summary${c.openSummary?' open':''}">
        <div class="a-grid">
          <div><div class="a-label">這份材料在說什麼？</div><div class="a-val markdown-body${c.sum1?'':' empty'}">${c.sum1?renderMd(c.sum1):'尚未填寫'}</div></div>
          <div><div class="a-label">與研究主題的關係？</div><div class="a-val markdown-body${c.sum2?'':' empty'}">${c.sum2?renderMd(c.sum2):'尚未填寫'}</div></div>
        </div>
      </div>

      <div class="sc-section section-imagination${c.openImagination?' open':''}">
        <div class="a-grid">
          <div><div class="a-label green">轉化成什麼裝置／場景？</div><div class="a-val green markdown-body${c.imag1?'':' empty'}">${c.imag1?renderMd(c.imag1):'尚未填寫'}</div></div>
          <div><div class="a-label green">需要什麼材料、訊號、測試？</div><div class="a-val green markdown-body${c.imag2?'':' empty'}">${c.imag2?renderMd(c.imag2):'尚未填寫'}</div></div>
          <div><div class="a-label green">誰在使用？誰被排除？</div><div class="a-val green markdown-body${c.imag3?'':' empty'}">${c.imag3?renderMd(c.imag3):'尚未填寫'}</div></div>
          <div><div class="a-label green">倫理風險？</div><div class="a-val green markdown-body${c.imag4?'':' empty'}">${c.imag4?renderMd(c.imag4):'尚未填寫'}</div></div>
        </div>
      </div>

      <div class="sc-section section-reference${c.openReference?' open':''}">
        ${(c.refImgs && c.refImgs.length) ? `<div class="ref-img-gallery">${c.refImgs.map(img=>`<img src="${img}" class="ref-gallery-img">`).join('')}</div>` : ''}
        <div class="a-val amber markdown-body${c.refText?'':' empty'}" style="margin-bottom:8px;">${c.refText?renderMd(c.refText):'尚未填寫說明'}</div>
        ${c.refUrl?`<a href="${c.refUrl}" target="_blank" class="book-link">🔗 ${c.refUrl.length>50?c.refUrl.slice(0,50)+'…':c.refUrl}</a>`:''}
      </div>
    </div>`;
  }).join('');
}

async function addWallQuestion(mid){
  const text=document.getElementById(`wallQText-${mid}`).value.trim();
  if(!text) return toast('請填入提問內容！');
  const who=document.getElementById(`wallQWho-${mid}`).value.trim()||'匿名';
  const id=Date.now();
  ensureMonthData(mid);
  data[mid].wall.unshift({id,type:'q',who,text,title:'',desc:'',url:'',imgSrc:''});
  [`wallQText-${mid}`,`wallQWho-${mid}`].forEach(x=>document.getElementById(x).value='');
  renderWall(mid); toast('提問貼上了！');
  if(IS_CONFIGURED){ try{ await apiPost({action:'add',sheet:'wall',data:{id,month:mid,type:'q',who,text,title:'',desc:'',url:'',imgSrc:''}}); } catch(e){ toastError('⚠️ 儲存失敗'); } }
}
async function addWallRef(mid){
  const title=document.getElementById(`wallTitle-${mid}`).value.trim();
  const desc=document.getElementById(`wallDesc-${mid}`).value.trim();
  const url=document.getElementById(`wallUrl-${mid}`).value.trim();
  const who=document.getElementById(`wallLinkWho-${mid}`).value.trim()||'匿名';
  const file=document.getElementById(`wallImg-${mid}`).files[0];
  if(!title && !url && !file) return toast('請至少填寫標題、連結或圖片！');
  const finish = (imgSrc) => {
    const id=Date.now();
    const type = imgSrc ? 'img' : 'link';
    ensureMonthData(mid);
    data[mid].wall.unshift({id,type,who,text:'',title:title||url||'參考資料',desc,url,imgSrc:imgSrc||''});
    [`wallTitle-${mid}`,`wallDesc-${mid}`,`wallUrl-${mid}`,`wallLinkWho-${mid}`].forEach(x=>document.getElementById(x).value='');
    document.getElementById(`wallImg-${mid}`).value='';
    renderWall(mid); toast('參考加入！');
    if(IS_CONFIGURED){ apiPost({action:'add',sheet:'wall',data:{id,month:mid,type,who,text:'',title:title||url||'參考資料',desc,url,imgSrc:imgSrc||''}}).catch(()=>toastError('⚠️ 儲存失敗')); }
  };
  if(file){ const reader=new FileReader(); reader.onload=e=>finish(e.target.result); reader.readAsDataURL(file); }
  else finish('');
}
async function removeWallItem(mid,id){
  data[mid].wall=data[mid].wall.filter(w=>w.id!==id); renderWall(mid);
  if(IS_CONFIGURED){ try{ await apiPost({action:'delete',sheet:'wall',id}); } catch(e){ toastError('⚠️ 刪除失敗'); } }
}
function linkThumb(url) { try { const u = new URL(url); return `https://www.google.com/s2/favicons?sz=128&domain=${u.hostname}`; } catch(e) { return ''; } }
function renderWall(mid){
  const el=document.getElementById(`wallGrid-${mid}`);
  if (!el) return;
  const items=(data[mid]&&data[mid].wall)||[];
  if(!items.length){el.innerHTML='<div class="empty-state">牆上還空著 — 留下第一個提問或參考！</div>';return;}
  el.innerHTML=items.map(w=>{
    if (w.type==='q') {
      return `<div class="wall-item type-q">
        <div class="wall-body">
          <span class="wall-type-tag type-q">提問</span>
          <div class="wall-q-text">${renderMd(w.text)}</div>
          <div class="wall-who">✦ ${w.who}</div>
        </div>
        <button class="wall-del" onclick="removeWallItem('${mid}',${w.id})" aria-label="移除">×</button>
      </div>`;
    }
    const thumbHtml = w.imgSrc
      ? `<img class="wall-thumb" src="${w.imgSrc}" alt="${w.title}">`
      : (w.url ? `<img class="wall-thumb" src="${linkThumb(w.url)}" alt="${w.title}" onerror="this.outerHTML='<div class=&quot;wall-link-placeholder&quot;>🔗</div>'">` : `<div class="wall-link-placeholder">🔗</div>`);
    return `<div class="wall-item type-${w.type}">
      ${thumbHtml}
      <div class="wall-body">
        <span class="wall-type-tag type-link">參考</span>
        <div class="wall-link-title">${w.title}</div>
        ${w.desc?`<div class="wall-link-desc">${w.desc}</div>`:''}
        ${w.url?`<a href="${w.url}" target="_blank" class="wall-link-url">${w.url.length>30?w.url.slice(0,30)+'…':w.url}</a>`:''}
        <div class="wall-who">✦ ${w.who}</div>
      </div>
      <button class="wall-del" onclick="removeWallItem('${mid}',${w.id})" aria-label="移除">×</button>
    </div>`;
  }).join('');
}

function toast(msg){ const el=document.getElementById('toast'); el.className='toast'; el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
function toastError(msg){ const el=document.getElementById('toast'); el.className='toast error'; el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }

refreshFloatingEmojis();
loadAllData();
</script>
